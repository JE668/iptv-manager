<!-- 在 <h2> 附近增加刷新按钮 -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🚀 IPTV 管理控制台</h2>
    <div>
        <span id="check-status" class="me-2"></span>
        <a href="/refresh" class="btn btn-sm btn-outline-primary">🔄 立即刷新所有源</a>
    </div>
</div>

<!-- 列表中的时间处理 -->
<table class="table align-middle">
    <thead><tr><th>源名称</th><th>状态</th><th>最后检测</th><th>操作</th></tr></thead>
    <tbody>
        {% for s in sources %}
        <tr>
            <td><strong>{{ s.name }}</strong><br><small class="text-muted">{{ s.url[:50] }}...</small></td>
            <td><span class="badge bg-{{ 'success' if s.status == 'Online' else 'danger' if s.status == 'Offline' else 'secondary' }}">{{ s.status }}</span></td>
            <td><small class="last-check" data-time="{{ s.last_check }}">计算中...</small></td>
            <td><a href="/delete/{{ s.id }}" class="text-danger">删除</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    // 自动计算“几分钟前”
    function timeSince(date) {
        if (date == 0) return "从未检测";
        var seconds = Math.floor((new Date() - new Date(date * 1000)) / 1000);
        if (seconds < 60) return "刚刚";
        if (seconds < 3600) return Math.floor(seconds/60) + "分钟前";
        return Math.floor(seconds/3600) + "小时前";
    }

    function updateTimeLabels() {
        document.querySelectorAll('.last-check').forEach(el => {
            el.innerText = timeSince(parseFloat(el.getAttribute('data-time')));
        });
    }

    // 轮询 API 更新状态
    async function checkStatus() {
        const r = await fetch('/api/status');
        const data = await r.json();
        document.getElementById('check-status').innerHTML = data.is_checking ? 
            '<span class="spinner-border spinner-border-sm text-primary"></span> 正在检测中...' : '';
    }

    setInterval(updateTimeLabels, 10000);
    setInterval(checkStatus, 3000);
    updateTimeLabels();
</script>
