<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Manager | 安全验证</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f7;
            color: #1d1d1f;
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            border: 1px solid #d2d2d7;
        }
        .brand {
            font-weight: 800;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: #86868b;
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #1d1d1f;
            margin-left: 5px;
        }
        .form-control {
            border-radius: 12px;
            padding: 0.75rem;
            border: 1px solid #d2d2d7;
            background: #fbfbfb;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
            border-color: #007aff;
        }
        .btn-login {
            background: #007aff;
            border: none;
            color: #fff;
            font-weight: 700;
            width: 100%;
            padding: 0.8rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            transition: all 0.2s;
        }
        .btn-login:hover {
            background: #0062cc;
            transform: translateY(-1px);
        }
        .error-msg {
            background: #fff5f5;
            color: #e53935;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            text-align: center;
            margin-bottom: 1.5rem;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">🔐 SECURITY</div>
        <div class="subtitle">请输入验证代码以访问控制台</div>
        
        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label">IDENTITY</label>
                <input type="text" name="username" class="form-control" placeholder="用户名" required>
            </div>
            <div class="mb-4">
                <label class="form-label">PASSCODE</label>
                <input type="password" name="password" class="form-control" placeholder="密码" required>
            </div>
            
            <button type="submit" class="btn-login">确认授权</button>
        </form>

        <div class="mt-4 text-center">
            <small style="color: #d2d2d7;">NextGen IPTV Manager v2.5</small>
        </div>
    </div>
</body>
</html>
