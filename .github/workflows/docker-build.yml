name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]  # 当你推送代码到 main 分支时触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 增加这一步：将用户名转换为小写并存入环境变量
      - name: Lowercase the repo name
        run: echo "REPO_NAME=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 使用上面处理好的小写环境变量
          tags: ghcr.io/${{ env.REPO_NAME }}/iptv-manager:latest
