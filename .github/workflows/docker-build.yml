name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]  # 当你推送代码到 main 分支时触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # 镜像名字格式：ghcr.io/你的用户名/iptv-manager:latest
          tags: ghcr.io/${{ github.repository_owner }}/iptv-manager:latest
