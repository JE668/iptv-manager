<!DOCTYPE html>
<html>
<head>
    <title>IPTV Manager Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .stats-card { background: #f8f9fa; border-radius: 10px; padding: 15px; margin-bottom: 20px; border-left: 5px solid #0d6efd; }
        .badge-stream { font-size: 0.8em; }
    </style>
</head>
<body class="container mt-5">
    <h2 class="mb-4">📺 IPTV 管理面板</h2>
    
    <!-- 实时流状态面板 -->
    <div class="card mb-4">
        <div class="card-header bg-dark text-white">实时缓冲池监控 (Active Streams)</div>
        <div class="card-body">
            <div id="active-streams-list" class="row">
                <p class="text-muted text-center">当前没有活动的代理流</p>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- 订阅管理 -->
        <div class="col-md-8">
            <div class="card p-3 mb-4">
                <h5>添加新订阅源</h5>
                <form action="/add_source" method="post" class="row g-2">
                    <div class="col-md-3"><input type="text" name="name" class="form-control" placeholder="名称"></div>
                    <div class="col-md-6"><input type="text" name="url" class="form-control" placeholder="链接"></div>
                    <div class="col-md-2"><select name="type" class="form-control"><option value="m3u">M3U</option><option value="txt">TXT</option></select></div>
                    <div class="col-md-1"><button type="submit" class="btn btn-primary">加</button></div>
                </form>
            </div>

            <table class="table table-hover">
                <thead><tr><th>名称</th><th>类型</th><th>操作</th></tr></thead>
                <tbody>
                    {% for source in sources %}
                    <tr><td>{{ source.name }}</td><td>{{ source.type }}</td><td><a href="/delete/{{ source.id }}" class="text-danger">删除</a></td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- 聚合链接 -->
        <div class="col-md-4">
            <div class="stats-card">
                <h6>🔗 聚合订阅地址</h6>
                <p class="small text-muted">直连模式（不消耗服务器流量）：</p>
                <code class="d-block mb-3">/playlist.m3u</code>
                <p class="small text-muted">代理模式（支持缓冲与监控）：</p>
                <code class="d-block text-primary">/playlist.m3u?proxy=True</code>
            </div>
        </div>
    </div>

    <script>
        // 定时刷新流状态
        async function updateStats() {
            const resp = await fetch('/api/streams');
            const data = await resp.json();
            const container = document.getElementById('active-streams-list');
            
            if (Object.keys(data).length === 0) {
                container.innerHTML = '<p class="text-muted text-center">当前没有活动的代理流</p>';
                return;
            }

            container.innerHTML = Object.entries(data).map(([name, s]) => `
                <div class="col-md-6 mb-3">
                    <div class="card shadow-sm p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <strong style="color:#0d6efd">${name}</strong>
                            <span class="badge bg-success">${s.clients} 人正在观看</span>
                        </div>
                        <div class="mt-2 small">
                            <div>分辨率: <b>${s.info.res}</b> | 编码: <b>${s.info.codec}</b></div>
                            <div>实时下载网速: <b class="text-danger">${s.speed}</b></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        setInterval(updateStats, 2000); // 2秒刷新一次
    </script>
</body>
</html>
